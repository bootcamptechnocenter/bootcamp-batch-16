marked.setOptions({gfm:true,breaks:true});
marked.use({renderer:(function(){
  var r=new marked.Renderer();
  r.code=function(code,lang){
    var h=(lang&&hljs.getLanguage(lang))
      ?hljs.highlight(code,{language:lang}).value
      :hljs.highlightAuto(code).value;
    return "<pre><code class=hljs>"+h+"</code></pre>";
  };

})()});
function run(titles,contents,coverFn){
  var cur=0, tot=contents.length+1;
  function go(i){
    cur=i;
    document.getElementById("progressBar").style.width=((i+1)/tot*100)+"%";
    document.getElementById("slideCounter").textContent=(i+1)+" / "+tot;
    document.getElementById("pageInfo").textContent=(i+1)+" / "+tot;
    document.getElementById("btnPrev").disabled=(i===0);
    document.getElementById("btnNext").disabled=(i===tot-1);
    if(i===0){
      document.getElementById("dayBadge").textContent="IDMS Training";
      document.getElementById("slideTitle").textContent="";
      document.getElementById("content").innerHTML=coverFn();
    } else {
      var n=i-1;
      document.getElementById("dayBadge").textContent="Hari "+String(i).padStart(2,"0");
      document.getElementById("slideTitle").textContent=titles[n]||"";
      document.getElementById("content").innerHTML=marked.parse(contents[n]);
      document.getElementById("content").scrollTop=0;
      document.querySelectorAll("#content pre code").forEach(function(el){hljs.highlightElement(el);});
    }
  }
  document.getElementById("btnPrev").addEventListener("click",function(){if(cur>0)go(cur-1);});
  document.getElementById("btnNext").addEventListener("click",function(){if(cur<tot-1)go(cur+1);});
  document.addEventListener("keydown",function(e){
    if(e.key==="ArrowRight"||e.key==="PageDown"){if(cur<tot-1)go(cur+1);}
    if(e.key==="ArrowLeft"||e.key==="PageUp"){if(cur>0)go(cur-1);}
  });
  go(0);
}

</script>

### ✅ KUNCI TANTANGAN 1

Console.Write("Nama Brand  : "); string nama = (Console.ReadLine() ?? "").Trim();

{ Console.WriteLine("❌ Tenor harus 1-5 tahun!"); return; }

decimal dpMin = otr > 300_000_000m ? otr * 0.25m : otr * 0.20m;
if (dpUser < dpMin)
{ Console.WriteLine($"❌ DP minimum: Rp {dpMin:N0}"); return; }

decimal pokok = otr - dpUser;
decimal bungaTotal = pokok * 0.06m * tenor;
decimal totalTagihan = pokok + bungaTotal;
int bulan = tenor * 12;
decimal cicilan = totalTagihan / bulan;

Console.WriteLine("=========== SIMULASI KREDIT IDMS ===========");
Console.WriteLine($"Harga OTR           : Rp {otr,15:N0}");
Console.WriteLine($"DP Minimum ({((otr > 300_000_000m) ? 25 : 20)}%)    : Rp {dpMin,15:N0}");

Console.WriteLine($"Sisa Pokok          : Rp {pokok,15:N0}");
Console.WriteLine($"Bunga 6% x {tenor} thn    : Rp {bungaTotal,15:N0}");
Console.WriteLine($"Total Tagihan       : Rp {totalTagihan,15:N0}");

## 14.20 | GETTER/SETTER & ENCAPSULATION (25 mnt)

### ① Kenapa Butuh Getter/Setter?

> *"Kalau property langsung public, siapa saja bisa ubah seenaknya. Bagaimana kalau stok di-set minus? Atau harga negatif? Getter/Setter = pagar."*

### ② Auto-Property vs Full Property

\`\`\`csharp
public class Product
{
    // Auto-property — compiler bikin backing field
    public string Name { get; set; } = string.Empty;

    // Full property — manual backing field
    private decimal _price;
    public decimal Price
    {
        get => _price;
        set
        {
            if (value < 0)
                throw new ArgumentException("Harga tidak boleh negatif!");
            _price = value;
        }
    }

    // Read-only property (hanya get)
    public string DisplayName => $"[{Code}] {Name} — Rp {Price:N0}";

    // Init-only (C# 9+) — hanya bisa di-set saat konstruksi
    public string Code { get; init; } = string.Empty;
}

### ③ Contoh Lengkap: RekeningBank (Encapsulation)

\`\`\`csharp
public class RekeningBank
{
    private string _noRekening;
    private string _namaNasabah;
    private decimal _saldo;
    private List<string> _mutasi = new();

    // Constructor
    public RekeningBank(string noRekening, string namaNasabah, decimal saldoAwal = 0)
    {
        _noRekening = noRekening;
        _namaNasabah = namaNasabah;
        _saldo = saldoAwal;
        _mutasi.Add($"Saldo awal: {saldoAwal:N0}");
    }

    // Getter (read-only dari luar)
    public string NoRekening => _noRekening;
    public string NamaNasabah => _namaNasabah;
    public decimal Saldo => _saldo;
    public IReadOnlyList<string> Mutasi => _mutasi.AsReadOnly();

    // Setter dengan validasi
    public void Setor(decimal jumlah)
    {
        if (jumlah <= 0)
        {
            Console.WriteLine("❌ Jumlah setor harus > 0");
            return;
        }
        _saldo += jumlah;
        _mutasi.Add($"Setor: +{jumlah:N0}");
        Console.WriteLine($"✅ Setor {jumlah:N0} berhasil. Saldo: {_saldo:N0}");
    }

    public bool Tarik(decimal jumlah)
    {
        if (jumlah <= 0)
        {
            Console.WriteLine("❌ Jumlah tarik harus > 0");
            return false;
        }
        if (jumlah > _saldo)
        {
            Console.WriteLine($"❌ Saldo tidak cukup! Saldo: {_saldo:N0}");
            return false;
        }
        _saldo -= jumlah;
        _mutasi.Add($"Tarik: -{jumlah:N0}");
        Console.WriteLine($"✅ Tarik {jumlah:N0} berhasil. Saldo: {_saldo:N0}");
        return true;
    }

    public void Transfer(RekeningBank tujuan, decimal jumlah)
    {
        if (Tarik(jumlah))
        {
            tujuan.Setor(jumlah);
            _mutasi.Add($"Transfer ke {tujuan.NoRekening}: -{jumlah:N0}");
            tujuan._mutasi.Add($"Terima dari {_noRekening}: +{jumlah:N0}");
            Console.WriteLine($"✅ Transfer Rp {jumlah:N0} ke {tujuan.NamaNasabah} berhasil");
        }
    }

    public void CetakMutasi()
    {
        Console.WriteLine($"\\n═══ Mutasi {_noRekening} ({_namaNasabah}) ═══");
        foreach (var m in _mutasi)
            Console.WriteLine($"  {m}");
        Console.WriteLine($"  Saldo akhir: Rp {_saldo:N0}");
    }
}

// PEMAKAIAN:
var r1 = new RekeningBank("001", "Budi", 1_000_000m);
var r2 = new RekeningBank("002", "Siti", 500_000m);

r1.Setor(200_000m);
r1.Tarik(50_000m);
r1.Transfer(r2, 300_000m);
r1.CetakMutasi();
r2.CetakMutasi();
\`\`\`

public class SuhuRuangan
{

    public SuhuRuangan(decimal celcius)
    {

    {

                throw new ArgumentException("Suhu di bawah absolute zero (-273.15°C)!");

        }

    public decimal Kelvin => _celcius + 273.15m;

    {
        if (_celcius < 20) return "❄️ Dingin";
        if (_celcius <= 26) return "😊 Normal";
        return "🔥 Panas";
    }
}

    public decimal DpPersen { get; set; }
    public int TenorBulan { get; set; }

    {

        HargaOtr = otr; DpPersen = dp; TenorBulan = tenor;
    }

        : this(no, nama, otr, dp, 36) { }

public decimal HitungCicilan(decimal otr, decimal dp, int tenor)
{
    if (otr <= 0)
        throw new ArgumentException("Harga OTR harus > 0");
    if (dp < 0 || dp > otr)
        throw new ArgumentException("DP tidak valid (0 - OTR)");
    if (tenor < 1 || tenor > 5)
        throw new ArgumentException("Tenor harus 1-5 tahun");

    decimal pokok = otr - dp;
    decimal bunga = pokok * 0.06m * tenor;
    return (pokok + bunga) / (tenor * 12);
}

// Panggil dengan try-catch:
try
{
    decimal cicilan = HitungCicilan(350_000_000m, 100_000_000m, 3);
    Console.WriteLine($"Cicilan: Rp {cicilan:N0}");
}
catch (ArgumentException ex)
{
    Console.WriteLine($"❌ {ex.Message}");
}
\`\`\`

## 14.10 | CREATE TABLE — DEEP DIVE (40 mnt)

### ① Tipe Data PostgreSQL — Yang Paling Sering Dipakai

| Tipe Data | Contoh | Analogi C# | Notes |
|---|---|---|---|
| \`SERIAL\` | \`id SERIAL\` | \`int\` + auto-increment | Primary key otomatis |
| \`INTEGER\` | \`stok INTEGER\` | \`int\` | ±2.1 milyar |
| \`BIGINT\` | \`total_unit BIGINT\` | \`long\` | ±9 quintillion |
| \`NUMERIC(18,2)\` | \`harga NUMERIC(18,2)\` | \`decimal\` | 18 digit, 2 desimal = uang |
| \`VARCHAR(n)\` | \`code VARCHAR(10)\` | \`string\` | Max n karakter |
| \`TEXT\` | \`keterangan TEXT\` | \`string\` | Tanpa batas |
| \`BOOLEAN\` | \`is_active BOOLEAN\` | \`bool\` | TRUE / FALSE |
| \`DATE\` | \`tgl_lahir DATE\` | \`DateOnly\` | Hanya tanggal |
| \`TIMESTAMP\` | \`created_at TIMESTAMP\` | \`DateTime\` | Tanggal + jam |
| \`JSONB\` | \`attributes JSONB\` | — | JSON (jarang, khusus kasus) |

> **Penting:** Di IDMS, \`NUMERIC\` dipakai untuk harga OTR, DP, cicilan. Jangan pakai \`FLOAT\` atau \`DOUBLE\` untuk uang — presisi bisa meleset!

### ② Constraint — Aturan di Tabel

| Constraint | Fungsi | Contoh |
|---|---|---|
| \`PRIMARY KEY\` | Unik + not null, identitas baris | \`id SERIAL PRIMARY KEY\` |
| \`NOT NULL\` | Wajib diisi | \`code VARCHAR(10) NOT NULL\` |
| \`UNIQUE\` | Tidak boleh duplikat | \`code VARCHAR(10) UNIQUE\` |
| \`DEFAULT\` | Nilai default | \`is_active BOOLEAN DEFAULT TRUE\` |
| \`CHECK\` | Validasi nilai | \`CHECK (stok >= 0)\` |
| \`REFERENCES\` (FK) | Relasi ke tabel lain | \`brand_id INTEGER REFERENCES mst_brands(id)\` |

## 16.20 | STORED PROCEDURE + VIEW (25 mnt)

### ① Kenapa Perlu Stored Procedure?

> *"Di IDMS, SP dipakai untuk operasi yang kompleks dan reusable. Bayangkan kalau tiap aplikasi harus nulis ulang query yang sama — repot! SP = function di database, bisa dipanggil dari C# nanti."*

### ② Stored Procedure: INSERT Brand dengan Validasi

\`\`\`sql
CREATE OR REPLACE PROCEDURE insert_brand(
    IN p_code VARCHAR,
    IN p_name VARCHAR,
    IN p_created_by VARCHAR,
    OUT out_stat BOOLEAN,
    OUT out_mess TEXT
)
LANGUAGE plpgsql
AS $$
BEGIN
    -- Validasi: code sudah dipakai?
    IF EXISTS (SELECT 1 FROM mst_brands WHERE code = p_code AND deleted_at IS NULL) THEN
        out_stat := FALSE;
        out_mess := 'Kode sudah dipakai: ' || p_code;
        RETURN;
    END IF;

    -- Validasi: nama tidak boleh kosong
    IF p_name IS NULL OR TRIM(p_name) = '' THEN
        out_stat := FALSE;
        out_mess := 'Nama brand tidak boleh kosong';
        RETURN;
    END IF;

    -- Insert
    INSERT INTO mst_brands (code, name, created_by, created_at)
    VALUES (p_code, p_name, p_created_by, NOW());

    out_stat := TRUE;
    out_mess := 'Brand berhasil ditambahkan';
END;
$$;
\`\`\`

### ③ Cara Panggil Stored Procedure

\`\`\`sql
-- CALL dengan output parameter (isi NULL untuk OUT)
CALL insert_brand('MZD', 'Mazda', 'admin', NULL, NULL);

-- Cek hasilnya
SELECT * FROM mst_brands WHERE code = 'MZD' AND deleted_at IS NULL;

-- Coba insert duplikat (harus gagal!)
CALL insert_brand('MZD', 'Mazda Motor', 'admin', NULL, NULL);
-- Output: out_stat = false, out_mess = 'Kode sudah dipakai: MZD'
\`\`\`

### ④ Stored Procedure: UPDATE dengan Validasi

\`\`\`sql
CREATE OR REPLACE PROCEDURE update_brand(
    IN p_id INTEGER,
    IN p_code VARCHAR,
    IN p_name VARCHAR,
    IN p_updated_by VARCHAR,
    OUT out_stat BOOLEAN,
    OUT out_mess TEXT
)
LANGUAGE plpgsql
AS $$
BEGIN
    -- Validasi: brand exists?
    IF NOT EXISTS (SELECT 1 FROM mst_brands WHERE id = p_id AND deleted_at IS NULL) THEN
        out_stat := FALSE;
        out_mess := 'Brand tidak ditemukan';
        RETURN;
    END IF;

    -- Validasi: code duplikat (kecuali dirinya sendiri)
    IF EXISTS (SELECT 1 FROM mst_brands WHERE code = p_code AND id != p_id AND deleted_at IS NULL) THEN
        out_stat := FALSE;
        out_mess := 'Kode sudah dipakai brand lain: ' || p_code;
        RETURN;
    END IF;

    -- Update
    UPDATE mst_brands
    SET code = p_code, name = p_name, updated_at = NOW(), updated_by = p_updated_by
    WHERE id = p_id AND deleted_at IS NULL;

    out_stat := TRUE;
    out_mess := 'Brand berhasil diupdate';
END;
$$;

-- Panggil
CALL update_brand(1, 'HON', 'Honda Motor Indonesia', 'admin', NULL, NULL);
\`\`\`

### ⑤ Stored Procedure: SOFT DELETE

\`\`\`sql
CREATE OR REPLACE PROCEDURE delete_brand(
    IN p_id INTEGER,
    IN p_deleted_by VARCHAR,
    OUT out_stat BOOLEAN,
    OUT out_mess TEXT
)
LANGUAGE plpgsql
AS $$
BEGIN
    IF NOT EXISTS (SELECT 1 FROM mst_brands WHERE id = p_id AND deleted_at IS NULL) THEN
        out_stat := FALSE;
        out_mess := 'Brand tidak ditemukan atau sudah dihapus';
        RETURN;
    END IF;

    -- Soft delete: isi deleted_at, jangan HAPUS baris!
    UPDATE mst_brands
    SET deleted_at = NOW(), deleted_by = p_deleted_by, is_active = FALSE
    WHERE id = p_id AND deleted_at IS NULL;

    out_stat := TRUE;
    out_mess := 'Brand berhasil dihapus';
END;
$$;

CALL delete_brand(5, 'admin', NULL, NULL);
\`\`\`

### ⑥ Stored Procedure: SELECT dengan Pagination

\`\`\`sql
CREATE OR REPLACE PROCEDURE get_brands_paginated(
    IN p_page INTEGER,
    IN p_limit INTEGER,
    IN p_search VARCHAR,
    OUT out_stat BOOLEAN,
    OUT out_mess TEXT
)
LANGUAGE plpgsql
AS $$
DECLARE
    v_offset INTEGER;
    v_total INTEGER;
BEGIN
    v_offset := (p_page - 1) * p_limit;

    -- Hitung total
    SELECT COUNT(*) INTO v_total
    FROM mst_brands
    WHERE deleted_at IS NULL
      AND (p_search IS NULL OR name ILIKE '%' || p_search || '%');

    -- Return data sebagai result set
    CREATE TEMP TABLE temp_result AS
    SELECT id, code, name, is_active, created_at
    FROM mst_brands
    WHERE deleted_at IS NULL
      AND (p_search IS NULL OR name ILIKE '%' || p_search || '%')
    ORDER BY id
    LIMIT p_limit OFFSET v_offset;

    out_stat := TRUE;
    out_mess := 'Total: ' || v_total || ' data';
END;
$$;

-- Panggil (tapi temp_result cuma visible di session ini)
CALL get_brands_paginated(1, 3, NULL, NULL, NULL);
SELECT * FROM temp_result;
\`\`\`

### ⑦ CREATE VIEW

> *"View = query yang disimpan. Bisa dipakai seperti tabel biasa. Cocok untuk laporan yang dipakai berulang."*

\`\`\`sql
-- View: Brand aktif
CREATE OR REPLACE VIEW v_active_brands AS
SELECT
    id,
    code,
    name,
    is_active,
    created_at::DATE AS created_date
FROM mst_brands
WHERE deleted_at IS NULL AND is_active = TRUE
ORDER BY name;

-- Query dari view (seperti tabel biasa!)
SELECT * FROM v_active_brands;
SELECT * FROM v_active_brands WHERE name ILIKE '%honda%';

-- View: Type dengan Brand Name
CREATE OR REPLACE VIEW v_type_with_brand AS
SELECT
    t.id,
    t.code AS type_code,
    t.name AS type_name,
    t.year,
    b.code AS brand_code,
    b.name AS brand_name
FROM mst_types t
JOIN mst_brands b ON t.brand_id = b.id
WHERE t.deleted_at IS NULL AND b.deleted_at IS NULL;

SELECT * FROM v_type_with_brand;
SELECT * FROM v_type_with_brand WHERE brand_name = 'Honda';

-- View: Summary Brand (COUNT type)
CREATE OR REPLACE VIEW v_brand_summary AS
SELECT
    b.id,
    b.code,
    b.name,
    COUNT(t.id) AS total_types,
    MAX(t.year) AS latest_year
FROM mst_brands b
LEFT JOIN mst_types t ON t.brand_id = b.id AND t.deleted_at IS NULL
WHERE b.deleted_at IS NULL
GROUP BY b.id, b.code, b.name
ORDER BY b.name;

SELECT * FROM v_brand_summary;
\`\`\`

### ✅ KUNCI LATIHAN 3

**Soal 1: SP Insert Type**
\`\`\`sql
CREATE OR REPLACE PROCEDURE insert_type(
    IN p_brand_id INTEGER,
    IN p_code VARCHAR,
    IN p_name VARCHAR,
    IN p_year INTEGER,
    IN p_created_by VARCHAR,
    OUT out_stat BOOLEAN,
    OUT out_mess TEXT
)
LANGUAGE plpgsql
AS $$
BEGIN
    -- Validasi brand exists
    IF NOT EXISTS (SELECT 1 FROM mst_brands WHERE id = p_brand_id AND deleted_at IS NULL) THEN
        out_stat := FALSE;
        out_mess := 'Brand tidak ditemukan';
        RETURN;
    END IF;

    -- Validasi duplikat code
    IF EXISTS (SELECT 1 FROM mst_types WHERE brand_id = p_brand_id AND code = p_code AND deleted_at IS NULL) THEN
        out_stat := FALSE;
        out_mess := 'Kode type sudah dipakai di brand ini';
        RETURN;
    END IF;

    -- Validasi year
    IF p_year < 1900 OR p_year > 2026 THEN
        out_stat := FALSE;
        out_mess := 'Tahun harus antara 1900-2026';
        RETURN;
    END IF;

    INSERT INTO mst_types (brand_id, code, name, year, created_by, created_at)
    VALUES (p_brand_id, p_code, p_name, p_year, p_created_by, NOW());

    out_stat := TRUE;
    out_mess := 'Type berhasil ditambahkan';
END;
$$;

-- Test

-- Harus gagal: Brand tidak ditemukan
\`\`\`

**Soal 2: View Aplikasi Kredit**
\`\`\`sql
CREATE OR REPLACE VIEW v_application_detail AS
SELECT
    a.application_no,
    c.full_name AS customer_name,
    b.name AS brand_name,
    t.name AS type_name,
    m.name AS model_name,
    a.otr_price,
    a.dp_amount,
    a.tenor_month,
    ((a.otr_price - a.dp_amount) * (1 + (a.interest_rate / 100) * (a.tenor_month / 12.0))) / a.tenor_month AS installment,
    a.status
FROM trn_applications a
JOIN mst_customer c ON a.customer_id = c.id
JOIN mst_models m ON a.model_id = m.id
JOIN mst_types t ON m.type_id = t.id
JOIN mst_brands b ON t.brand_id = b.id
WHERE a.deleted_at IS NULL;

SELECT * FROM v_application_detail;
SELECT * FROM v_application_detail WHERE status = 'APPROVED';
\`\`\`

**Soal 3: SP dengan View**
\`\`\`sql
CREATE OR REPLACE PROCEDURE get_applications_by_status(
    IN p_status VARCHAR,
    OUT out_stat BOOLEAN,
    OUT out_mess TEXT
)
LANGUAGE plpgsql
AS $$
DECLARE
    v_count INTEGER;
BEGIN
    CREATE TEMP TABLE temp_app_result AS
    SELECT * FROM v_application_detail
    WHERE (p_status IS NULL OR status = p_status);

    GET DIAGNOSTICS v_count = ROW_COUNT;
    out_stat := TRUE;
    out_mess := 'Ditemukan ' || v_count || ' aplikasi';
END;
$$;

CALL get_applications_by_status('DRAFT', NULL, NULL);
SELECT * FROM temp_app_result;

// Services/Impl/MstBrandService.cs
public class MstBrandService : IMstBrandService
{
    private readonly AppDbContext _context;
    public MstBrandService(AppDbContext context) => _context = context;

    public async Task<PagedResult<ResMstBrandDto>> GetMstBrand(ReqBaseParamDto dto)
    {
        var query = _context.MstBrands.AsQueryable();
        if (!string.IsNullOrWhiteSpace(dto.Search))
        {
            var search = dto.Search.ToLower();
            query = query.Where(x =>
                (x.Code != null && x.Code.ToLower().Contains(search)) ||
                (x.Name != null && x.Name.ToLower().Contains(search)));
        }
        query = query.Where(x => x.DeletedAt == null);
        var totalCount = await query.CountAsync();
        var page = dto.Page > 0 ? dto.Page : 1;
        var pageSize = dto.Limit > 0 ? dto.Limit : 10;
        var skip = (page - 1) * pageSize;
        var totalPages = (int)Math.Ceiling(totalCount / (double)pageSize);
        var items = await query.OrderBy(x => x.Id).Skip(skip).Take(pageSize)
            .Select(x => new ResMstBrandDto { Id = x.Id, Code = x.Code, Name = x.Name })
            .ToListAsync();
        return new PagedResult<ResMstBrandDto>
        {
            Items = items,
            Pagination = new Pagination { TotalItems = totalCount, CurrentPage = page, Limit = pageSize, TotalPages = totalPages }
        };
    }

    public async Task<ResMstBrandDto?> GetMstBrandById(int id) =>
        await _context.MstBrands.Where(x => x.Id == id && x.DeletedAt == null)
            .Select(x => new ResMstBrandDto { Id = x.Id, Code = x.Code, Name = x.Name }).FirstOrDefaultAsync();

    public async Task CreateMstBrand(ReqCreateMstBrandDto dto)
    {
        var brand = new MstBrands { Code = dto.Code, Name = dto.Name, IsActive = dto.IsActive, CreatedAt = DateTime.Now, CreatedBy = dto.CreatedBy };
        _context.MstBrands.Add(brand); await _context.SaveChangesAsync();
    }

    public async Task<bool> UpdateMstBrand(ReqUpdateMstBrandDto dto, int id)
    {
        var brand = await _context.MstBrands.FirstOrDefaultAsync(x => x.Id == id && x.DeletedAt == null);
        if (brand == null) return false;
        brand.Code = dto.Code; brand.Name = dto.Name; brand.IsActive = dto.IsActive;
        brand.UpdatedAt = DateTime.Now; brand.UpdatedBy = dto.UpdatedBy;
        await _context.SaveChangesAsync(); return true;
    }

    public async Task<bool> DeleteMstBrand(int id)
    {
        var brand = await _context.MstBrands.FirstOrDefaultAsync(x => x.Id == id && x.DeletedAt == null);
        if (brand == null) return false;
        brand.DeletedAt = DateTime.Now; brand.DeletedBy = "system";
        await _context.SaveChangesAsync(); return true;
    }
}

// IDMS/Middleware/ApiKeyMiddleware.cs
namespace IDMS.Middleware;
public class ApiKeyMiddleware
{
    private readonly RequestDelegate _next;
    private readonly IConfiguration _config;
    private const string ApiKeyHeaderName = "X-Api-Key";
    public ApiKeyMiddleware(RequestDelegate next, IConfiguration config) { _next = next; _config = config; }
    public async Task InvokeAsync(HttpContext context)
    {
        if (!context.Request.Headers.TryGetValue(ApiKeyHeaderName, out var extractedApiKey))
        {
            context.Items["ErrorMessage"] = "Missing API Key";
            context.Response.StatusCode = StatusCodes.Status401Unauthorized;
            return;
        }
        var configuredApiKey = _config["Security:ApiKey"];
        if (string.IsNullOrWhiteSpace(configuredApiKey) || !configuredApiKey.Equals(extractedApiKey))
        {
            context.Items["ErrorMessage"] = "Invalid API Key";
            context.Response.StatusCode = StatusCodes.Status401Unauthorized;
            return;
        }
        await _next(context);
    }
}

### MstUserService — CreateUserAsync (FULL CODE dari IDMS)
\`\`\`csharp
public class MstUserService : IMstUserService
{
    private readonly AppDbContext _context;
    private readonly IJwtService _jwtService;

    public async Task<bool> CreateUserAsync(ReqCreateUserDto req)
    {
        bool isEmailExist = await _context.MstUsers.AnyAsync(u => u.Email == req.Email);
        if (isEmailExist) throw new ArgumentException("Email already exists.");

        var encryptedPassword = BCrypt.Net.BCrypt.HashPassword(req.Password); // HASH!

        var user = new MstUser
        {
            Email = req.Email, Password = encryptedPassword, FullName = req.FullName
        };
        _context.MstUsers.Add(user);
        return await _context.SaveChangesAsync() > 0;
    }
}

## 14.00 | LOGIN + JWT TOKEN

### Login (FULL CODE dari IDMS)
\`\`\`csharp
public async Task<ResLoginDto> Login(ReqLoginDto req)
{
    var user = await _context.MstUsers.FirstOrDefaultAsync(u => u.Email == req.Email);
    if (user == null || !BCrypt.Net.BCrypt.Verify(req.Password, user.Password))
        throw new UnauthorizedAccessException("Invalid email or password.");

    var token = _jwtService.GenerateToken(user.Id.ToString(), user.Email, user.FullName);
    return new ResLoginDto { Token = token, Email = user.Email };
}
\`\`\`

### JwtServices (FULL CODE dari IDMS)
\`\`\`csharp
public class JwtServices : IJwtService
{
    private readonly IConfiguration _configuration;

    public string GenerateToken(string Id, string Email, string FullName)
    {
        var claims = new[]
        {
            new Claim(ClaimTypes.NameIdentifier, Id),
            new Claim(ClaimTypes.Email, Email),
            new Claim("UserFullName", FullName)
        };
        var key = new SymmetricSecurityKey(Encoding.UTF8.GetBytes(_configuration["Jwt:Key"]!));
        var creds = new SigningCredentials(key, SecurityAlgorithms.HmacSha256);
        var token = new JwtSecurityToken(
            issuer: _configuration["Jwt:Issuer"], audience: _configuration["Jwt:Audience"],
            claims: claims, expires: DateTime.Now.AddHours(8), signingCredentials: creds);
        return new JwtSecurityTokenHandler().WriteToken(token);
    }
}
\`\`\`
