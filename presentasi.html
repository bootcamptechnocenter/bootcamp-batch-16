## 🎯 Apa itu .NET?

**.NET** adalah platform pengembangan dari Microsoft untuk membangun berbagai jenis aplikasi:
- **Web API** — backend service (seperti project **IDMS** yang kita pelajari)
- **Web MVC** — website dinamis
- **Desktop** — aplikasi Windows
- **Mobile** — aplikasi Android/iOS via MAUI

> 💡 Analogi: .NET adalah **pabrik serbaguna**. C# adalah **bahasa instruksi** ke pekerja pabriknya.

## 📦 Struktur Project IDMS

Project IDMS menggunakan arsitektur **4 layer**:

| Layer | Project | Tanggung Jawab |
|---|---|---|
| **API** | \`IDMS\` | HTTP request, routing, controller |
| **Infrastructure** | \`IDMS.Infrastructure\` | Database, configuration, migration |

## ✏️ Variable & Tipe Data di C#

C# adalah bahasa **strongly typed** — setiap variabel harus punya tipe.

| Tipe | C# | Contoh | Ukuran |
|---|---|---|
| Boolean | \`bool\` | \`true\`, \`false\` | 1 bit |
| Integer | \`int\` | \`42\`, \`-10\` | 32 bit |
| Long | \`long\` | \`9999999999L\` | 64 bit |
| Desimal | \`decimal\` | \`250000000.50m\` | 128 bit |
| Float | \`double\` | \`3.14\` | 64 bit |
| Karakter | \`char\` | \`'A'\` | 16 bit |
| Teks | \`string\` | \`"Honda"\` | reference |
| Nullable | \`int?\`, \`string?\` | Boleh null | — |

## 🔒 Encapsulation (Getter/Setter)

\`\`\`csharp
public class RekeningTabungan
{
    private decimal _saldo = 0;        // private — tidak bisa diakses luar
    public decimal Saldo => _saldo;    // read-only

    public string Setor(decimal jumlah)
    {
        if (jumlah <= 0) return "❌ Jumlah harus > 0";
        _saldo += jumlah;
        return \$"✅ Setor {jumlah:N0}. Saldo: {_saldo:N0}";
    }
}
\`\`\`

| Modifier | Akses |
|---|---|
| \`public\` | Bisa dari mana saja |
| \`private\` | Hanya dari dalam class sendiri |
| \`get; set;\` | Baca & tulis |
| \`get; private set;\` | Baca dari luar, tulis dari dalam |
| \`get;\` | Read-only |

{

## 🏗️ CREATE TABLE

Struktur tabel di IDMS menggunakan **soft delete pattern**:

\`\`\`sql
CREATE TABLE mst_brands (
    id          SERIAL PRIMARY KEY,
    code        VARCHAR(10)  NOT NULL,
    name        VARCHAR(100) NOT NULL,
    is_active   BOOLEAN      NOT NULL DEFAULT TRUE,
    created_at  TIMESTAMP    NOT NULL DEFAULT NOW(),
    created_by  VARCHAR(100),
    updated_at  TIMESTAMP,
    updated_by  VARCHAR(100),
    deleted_at  TIMESTAMP,         -- NULL = belum dihapus (soft delete)
    deleted_by  VARCHAR(100)
);
\`\`\`

### Field Audit (Pola IDMS)
- \`created_at\` / \`created_by\` — kapan & siapa yang buat
- \`updated_at\` / \`updated_by\` — kapan & siapa yang edit
- \`deleted_at\` / \`deleted_by\` — kapan & siapa yang hapus

> 💡 **Soft delete**: data tidak benar-benar dihapus. Hanya \`deleted_at\` diisi timestamp. \`deleted_at IS NULL\` = masih aktif.

## 📝 CRUD Operations

### INSERT
\`\`\`sql
INSERT INTO mst_brands (code, name, created_by)
VALUES ('HON', 'Honda',   'admin'),
       ('TOY', 'Toyota',  'admin'),
       ('SUZ', 'Suzuki',  'admin');
\`\`\`

### SELECT (selalu filter soft delete)
\`\`\`sql
SELECT * FROM mst_brands WHERE deleted_at IS NULL;

-- Pencarian (case-insensitive)
SELECT * FROM mst_brands
WHERE deleted_at IS NULL AND name ILIKE '%honda%';
\`\`\`

### UPDATE
\`\`\`sql
UPDATE mst_brands
SET    name = 'Honda Motor', updated_at = NOW(), updated_by = 'admin'
WHERE  id = 1;
\`\`\`

### SOFT DELETE
\`\`\`sql
UPDATE mst_brands
SET    deleted_at = NOW(), deleted_by = 'admin', is_active = FALSE
WHERE  id = 3;
\`\`\`

> ❗ **Tidak pernah**: \`DELETE FROM mst_brands WHERE id = 3;\` ← hard delete!

## 🔗 JOIN

\`\`\`sql
SELECT m.code AS model_code, m.name AS model_name,
       t.name AS type_name, b.name AS brand_name
FROM   mst_models m
JOIN   mst_types  t ON m.type_id  = t.id
JOIN   mst_brands b ON t.brand_id = b.id
WHERE  m.deleted_at IS NULL
AND    t.deleted_at IS NULL
AND    b.deleted_at IS NULL
ORDER  BY b.name, t.name;
\`\`\`

| JOIN Type | Hasil |
|---|---|
| \`INNER JOIN\` | Hanya yang match di kedua tabel |
| \`LEFT JOIN\` | Semua dari kiri + yang match di kanan |

    OUT out_mess     TEXT
)
LANGUAGE plpgsql
AS \$\$
BEGIN
    IF EXISTS (
        SELECT 1 FROM mst_brands
        WHERE code = p_code AND deleted_at IS NULL
    ) THEN
        out_stat := FALSE;
        out_mess := 'Kode sudah dipakai: ' || p_code;
        RETURN;
    END IF;

    INSERT INTO mst_brands (code, name, created_by, created_at)
    VALUES (p_code, p_name, p_created_by, NOW());

    out_stat := TRUE;
    out_mess := 'Brand berhasil ditambahkan';
END;
\$\$;

-- Panggil:
CALL insert_brand('MZD', 'Mazda', 'admin', NULL, NULL);
\`\`\`

> \`out_stat\` (boolean) + \`out_mess\` (text) = pola standar response procedure di IDMS.

public class MstBrandsConfiguration : IEntityTypeConfiguration<MstBrands>
{
    public void Configure(EntityTypeBuilder<MstBrands> builder)
    {
        builder.ToTable("mst_brands");
        builder.HasKey(e => e.Id).HasName("pk_mst_brand");

        builder.Property(e => e.Id)
            .HasColumnName("id").UseSerialColumn();

        builder.Property(e => e.Code)
            .HasColumnName("code").HasColumnType("varchar(10)")
            .IsRequired().HasMaxLength(10);

        builder.Property(e => e.Name)
            .HasColumnName("name").HasColumnType("varchar(100)")
            .IsRequired().HasMaxLength(100);

}

\`\`\`csharp
public class MstBrandService : IMstBrandService
{
    private readonly AppDbContext _context;

    public async Task<PagedResult<ResMstBrandDto>> GetMstBrand(ReqBaseParamDto dto)
    {
        var query = _context.MstBrands.AsQueryable();

        if (!string.IsNullOrWhiteSpace(dto.Search))
        {
            var search = dto.Search.ToLower();
            query = query.Where(x =>
                x.Code.ToLower().Contains(search) ||
                x.Name.ToLower().Contains(search));
        }

        query = query.Where(x => x.DeletedAt == null); // ← soft delete filter

        var totalCount = await query.CountAsync();
        var items = await query
            .OrderBy(x => x.Id)
            .Skip((dto.Page - 1) * dto.Limit)
            .Take(dto.Limit)
            .Select(x => new ResMstBrandDto { Id = x.Id, Code = x.Code, Name = x.Name })
            .ToListAsync();

        return new PagedResult<ResMstBrandDto> { Items = items, Pagination = ... };
    }

    // Soft delete
    public async Task<bool> DeleteMstBrand(int id)
    {
        var brand = await _context.MstBrands
            .FirstOrDefaultAsync(x => x.Id == id && x.DeletedAt == null);
        if (brand == null) return false;

        brand.DeletedAt = DateTime.Now;
        brand.DeletedBy = "system";
        await _context.SaveChangesAsync();
        return true;
    }
}

## 🔐 API Key Middleware

\`\`\`csharp
public class ApiKeyMiddleware
{
    private const string ApiKeyHeaderName = "X-Api-Key";

    public async Task InvokeAsync(HttpContext context)
    {
        if (!context.Request.Headers.TryGetValue(ApiKeyHeaderName, out var key))
        {
            context.Response.StatusCode = 401;
            return;
        }
        if (!_config["Security:ApiKey"].Equals(key))
        {
            context.Response.StatusCode = 401;
            return;
        }
        await _next(context);
    }
}

## 🔑 Login & Generate JWT

\`\`\`csharp
public async Task<ResLoginDto> Login(ReqLoginDto req)
{
    // 1. Cari user by email
    var user = await _context.MstUsers.FirstOrDefaultAsync(u => u.Email == req.Email);

    // 2. Verifikasi password dengan BCrypt
    if (user == null || !BCrypt.Net.BCrypt.Verify(req.Password, user.Password))
        throw new UnauthorizedAccessException("Invalid email or password.");

    // 3. Generate token
    var token = _jwtService.GenerateToken(user.Id.ToString(), user.Email, user.FullName);

    return new ResLoginDto { Token = token, Email = user.Email };
}

## 🎫 JWT Token Structure

\`\`\`
HEADER.PAYLOAD.SIGNATURE

Header:   {"alg": "HS256", "typ": "JWT"}
Payload:  {"nameid": "1", "email": "user@mail.com", "UserFullName": "Budi"}
Signature: HMACSHA256(base64(header) + "." + base64(payload), secret)

## 🔨 Generate JWT Token

\`\`\`csharp
public string GenerateToken(string Id, string Email, string FullName)
{
    var claims = new[]
    {
        new Claim(ClaimTypes.NameIdentifier, Id),
        new Claim(ClaimTypes.Email, Email),
        new Claim("UserFullName", FullName)
    };

    var key = new SymmetricSecurityKey(
        Encoding.UTF8.GetBytes(_configuration["Jwt:Key"]!));

    var creds = new SigningCredentials(key, SecurityAlgorithms.HmacSha256);

    var token = new JwtSecurityToken(
        issuer: _configuration["Jwt:Issuer"],
        audience: _configuration["Jwt:Audience"],
        claims: claims,
        expires: DateTime.Now.AddHours(8),
        signingCredentials: creds
    );

    return new JwtSecurityTokenHandler().WriteToken(token);
}

builder.Services.AddAuthentication(JwtBearerDefaults.AuthenticationScheme)
    .AddJwtBearer(options =>
    {
        options.TokenValidationParameters = new TokenValidationParameters
        {
            ValidateIssuer = true, ValidateAudience = true,
            ValidateLifetime = true, ValidateIssuerSigningKey = true,
            ValidIssuer = builder.Configuration["Jwt:Issuer"],
            ValidAudience = builder.Configuration["Jwt:Audience"],
            IssuerSigningKey = new SymmetricSecurityKey(

        };
    });

## ❓ Pertanyaan yang Mungkin Ditanyakan

**"Kenapa pisahkan interface dari implementasi?"**
> Controller tidak perlu tahu cara service bekerja. Memudahkan testing (mock) dan ganti implementasi.

**"Tunjukkan soft delete di kode kamu!"**
> Di service Delete: \`entity.DeletedAt = DateTime.Now\`. Query: \`.Where(x => x.DeletedAt == null)\`.

**"Kenapa CreatedBy dari token, bukan body?"**
> Body bisa dimanipulasi client. JWT sudah divalidasi server — claim bisa dipercaya.

**"Jelaskan middleware pipeline!"**
> Swagger → ApiKeyMiddleware → Authentication → Authorization → Controller
